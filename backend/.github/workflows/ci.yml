name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, intl
      - run: composer install --no-progress --prefer-dist
      - run: composer lint

  test:
    name: Test (PHPUnit)
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        php: [8.3]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, bcmath, intl, pdo_sqlite
      - run: composer install --no-progress --prefer-dist
      - name: Run tests
        run: |
          cp .env.ci .env
          php artisan test --parallel --stop-on-failure
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --no-progress --prefer-dist
      - run: composer audit

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm audit --audit-level=high
