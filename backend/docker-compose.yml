services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdam-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - /var/www/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: pdam
      DB_USERNAME: pdam
      DB_PASSWORD: pdam_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - pdam-net
    ports:
      - "${APP_PORT:-8080}:80"
      - "${APP_PORT_HTTPS:-8443}:443"
    volumes:
      - ./docker/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro

  mysql:
    image: mysql:8.0
    container_name: pdam-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: pdam
      MYSQL_USER: pdam
      MYSQL_PASSWORD: pdam_secret
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql.cnf:/etc/mysql/conf.d/custom.cnf
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "pdam", "-ppdam_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pdam-net

  redis:
    image: redis:7-alpine
    container_name: pdam-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - pdam-net

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdam-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - ./:/var/www
      - /var/www/vendor
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: pdam
      DB_USERNAME: pdam
      DB_PASSWORD: pdam_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - pdam-net

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdam-scheduler
    restart: unless-stopped
    working_dir: /var/www
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          php artisan schedule:run --verbose --no-interaction
          sleep 60
        done
    volumes:
      - ./:/var/www
      - /var/www/vendor
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: pdam
      DB_USERNAME: pdam
      DB_PASSWORD: pdam_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - pdam-net

volumes:
  mysql_data:
  redis_data:

networks:
  pdam-net:
    driver: bridge
