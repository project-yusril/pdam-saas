; ============================================================================
; supervisord.production.conf — worker queue + scheduler di TARGET production
; (rekomendasi §13: worker default aktif, retry, failed_jobs terbukti).
; Pasang di /etc/supervisor/conf.d/pdam-queue.conf lalu:
;   supervisorctl reread && supervisorctl update && supervisorctl status
; ============================================================================

[program:pdam-queue-default]
command=php artisan queue:work --queue=default,notifications,payments --tries=3 --backoff=5,30,120 --timeout=90 --sleep=1 --max-time=3600
directory=/var/www/pdam/backend
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/pdam/queue-%(process_num)02d.log
stderr_logfile=/var/log/pdam/queue-%(process_num)02d.err.log
environment=APP_ENV=production

; scheduler menit-per-menit tanpa cron host (opsional bila cron sulit)
[program:pdam-scheduler]
command=/bin/sh -c "while true; do php /var/www/pdam/backend/artisan schedule:run --force --no-interaction; sleep 55; done"
directory=/var/www/pdam/backend
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/pdam/scheduler.log
stderr_logfile=/var/log/pdam/scheduler.err.log

; alarm queue health via syslog (kronolog/rsyslog bisa kirim ke alerting)
[program:pdam-queue-health]
command=/bin/sh -c "while true; do php /var/www/pdam/backend/artisan pdam:queue-health --max-failed-age-hours=1; sleep 300; done"
directory=/var/www/pdam/backend
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/pdam/queue-health.log
stderr_logfile=/var/log/pdam/queue-health.err.log

# Event-listener PROTOKOL SUPERVISOR (bukan while-read). Harus mengirim
# `READY` lalu memproses header. Script ops/supervisor/crash_alert.py implementasi
# protokol yang benar; salin file tsb ke /var/www/pdam/ops/supervisor/.
[eventlistener:pdam-crashalert]
command=python3 /var/www/pdam/ops/supervisor/crash_alert.py
events=PROCESS_STATE_STOPPED,PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
directory=/var/www/pdam/backend
user=www-data
buffer_size=1024
