name: pdam_mobile
description: Aplikasi PDAM Mobile - Customer, Petugas Baca Meter, Petugas Survey
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  crypto: ^3.0.3
  flutter_secure_storage: ^9.0.0
  go_router: ^12.1.1
  flutter_riverpod: ^2.4.9
  hive_flutter: ^1.1.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  firebase_messaging: ^14.7.8
  firebase_core: ^2.24.2
  camera: ^0.10.5+9
  permission_handler: ^11.1.0
  connectivity_plus: ^5.0.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  image_picker: ^1.0.7
  url_launcher: ^6.2.2
  shimmer: ^3.0.0
  intl: ^0.19.0
  path_provider: ^2.1.1
  path: ^1.8.3


dependencies_overrides: {}

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
