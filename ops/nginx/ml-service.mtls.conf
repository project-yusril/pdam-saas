server {
    # mTLS opsional utk private ML service (rekomendasi C-05 hardening).
    # Aktifkan SELANJUTNYA setelah service ML di dalam VPC / host loopback
    # tidak cukup; Laravel mengakses dengan curl --cert/--key (env
    # ML_CLIENT_CERT/ML_CLIENT_KEY) atau stream context.
    listen 127.0.0.1:8443 ssl;
    server_name ml.internal.pdam;

    ssl_certificate     /etc/pdam/ml/tls/ml.crt;
    ssl_certificate_key /etc/pdam/ml/tls/ml.key;
    ssl_client_certificate /etc/pdam/ml/tls/ca.crt;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:8100;   # uvicorn ml/src/api.py
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Mtls-CN $ssl_client_s_dn;
        proxy_set_header X-Service-Token $http_x_service_token;   # tetap token
        proxy_read_timeout 60s;
    }
}
